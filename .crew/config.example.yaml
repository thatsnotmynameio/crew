# yaml-language-server: $schema=https://raw.githubusercontent.com/thatsnotmynameio/crew/main/schema/config.schema.json
## Every key crew reads, commented out. Copy what you need to
## .crew/config.yaml, .crew/config.local.yaml or your global config file and
## uncomment it. A line with one # is a setting; a line with ## explains the
## setting below it, so uncommenting a whole block keeps its explanations as
## comments. A value shown is the key's default when it has one, otherwise an
## example.
##
## crew reads three files, in this order:
##
## - Your global config file, ~/.config/crew/config.yaml on Linux and macOS,
##   or $XDG_CONFIG_HOME/crew/config.yaml when XDG_CONFIG_HOME is set: your
##   settings for every repository crew runs in, such as your agents or a
##   board.
## - .crew/config.yaml, the repository's shared workflow. Commit it.
## - .crew/config.local.yaml, your own settings on this machine, such as
##   poll_interval_seconds or a board. Have git ignore it.
##
## Any of them may be missing, but not all three, and together they need
## rules. Each top-level key a later file sets replaces that whole key of the
## earlier ones: a local board replaces the board, and a local agents
## replaces every agent, so to change one agent's model, copy all of agents.
## A key with no value, such as "board:", brings back crew's default for it.
## Keys a later file leaves out keep their value from an earlier one, and
## keys no file sets keep crew's defaults.
##
## The modeline on this file's first line gives editors completion and help
## for every key. It works in all three files.
##
## crew's own rules, which run on crew's repository, are in
## .crew/config.yaml beside this file.

## Seconds between polls of the tracker. Must be positive.
# poll_interval_seconds: 300

## How many issues crew works on at once, shared by the queues. It counts
## issues, not sessions: an issue whose rule runs several actions takes one
## slot.
# max_parallel_issues: 2

## How long crew runs, counted from its first poll, before it winds down.
## 28800 is 8 hours. Without it, crew runs until you stop it.
# run_time_limit_seconds: 28800

## Whether the issue's status comment shows each ended action's cost, tokens
## and pull request.
# usage_in_status: false

## The Apps whose comments answer a question a session asks on its issue,
## by login, <slug>[bot]. The code owners always answer; collaborators and
## other Apps do not. Without it, crew's own bots answer; a list replaces
## them, and [] has no App answer. github-actions[bot] never answers: any
## workflow can post anyone's text as it.
# answering_apps:
#   - claude[bot]

## Queues by name, each with its slots. A queue's slots serve only the rules
## that name it, so a long session never holds up a quick rule of another
## queue. The queue default always exists: it gets the slots
## max_parallel_issues leaves, and runs every rule that names no queue.
# queues:
#   reviews: 1

## The tracker crew polls for issues and pull requests, and writes to.
# tracker:
#   ## The tracker adapter. github is the one crew ships.
#   name: github
#   ## The bot crew's own writes act as, and the bot of every agent that names
#   ## none. Create one with `crew bots create <name>`. Without it, crew acts
#   ## as the gh login it runs as.
#   bot: clerk

## Agents by name. An agent is the harness that runs a session, its model,
## and the bot the session acts as. A session names its agent with agent.
## Required when a rule has a session.
# agents:
#   developer:
#     harness:
#       ## The harness adapter: claude (Claude Code) or codex.
#       name: claude
#       ## The model the harness runs. Without it, the harness picks its own:
#       ## the one in its own config, or its default.
#       model: claude-opus-5-5
#     ## The bot the agent's sessions, and the shell actions after them, act
#     ## as. Without it, they act as tracker.bot, or as the gh login crew runs
#     ## as.
#     bot: developer
#   reviewer:
#     harness:
#       name: codex
#       model: gpt-5.5

## Shell actions by name, each a shell script, defined once and named in the
## rules' actions and routes. It runs in the rule run's worktree and passes
## when it exits 0; any other exit status fails it, unless verdicts names
## the status's verdict. The last line it prints reaches the issue's status
## comment, so print your reason last. It reads:
##   CREW_ISSUE_REF, CREW_ISSUE_KEY, CREW_ISSUE_URL  the issue
##   CREW_BRANCH                                     the worktree's branch
##   CREW_ACTION                                     the latest session's name
##   CREW_CODE_OWNERS, CREW_BOTS                     logins, space-separated
##   CREW_PROMPT_FILE                                the session's prompt
##   CREW_LAST_MESSAGE_FILE                          the session's last message
## A name cannot be a word of the rules' grammar: agent, prompt, name, on,
## wait, resume, script, verdicts, report, close, move, comment or next.
# actions:
#   ## A string is the script.
#   tests: go test ./...
#   pr-opened: |-
#     n=$(gh pr list --head "$CREW_BRANCH" --state open --json number --jq length) || exit 1
#     [ "$n" -gt 0 ] || { echo "no open pull request from $CREW_BRANCH"; exit 1; }
#   ## A mapping is the script and how it ends.
#   judge:
#     script: ./scripts/judge.sh
#     ## The verdict an exit status gives, by status. A verdict's name is a
#     ## lowercase letter, then lowercase letters, digits, - or _.
#     verdicts:
#       3: needs_person
#     ## self: a resume that restarts at this action starts at it, not at the
#     ## latest session before it. For a script that checks something outside
#     ## the worktree, such as CI.
#     resume: self

## The live view's board: columns by name, drawn in file order, each with one
## label or a list of labels. A column holds a card for each open issue that
## carries one of its labels. Without board, the board has one column per
## rule that has actions.
# board:
#   to do: ready
#   doing: [in progress, in review]
#   failed: [failed, review failed]

## Rules by name. A rule takes the items that carry its ready label, moves
## each to running, runs its actions one after another in one git worktree
## and branch, and ends through one of its routes: passed after its last
## action, or the route an action's verdict leads to. Rules form no
## sequence: work moves on only because a label one rule's route moves to is
## another's ready label. Among rules of equal priority, a later rule in the
## file takes first.
# rules:
#   development:
#     ## The kind of item the rule takes: issues or pull_requests.
#     takes: issues
#     ## The queue the rule runs in: one of queues, or default.
#     queue: default
#     ## Whether crew sends a desktop notification when the rule ends. On by
#     ## default for a rule with actions, off for a rule without.
#     notify: true
#     ## The rule's labels, by state. They compare ignoring case.
#     labels:
#       ## The label the rule takes items from. No two rules take the same one.
#       ready: ready
#       ## The label an item carries while the rule works on it. It cannot be
#       ## any rule's ready label.
#       running: in progress
#     ## The rule's actions, run one after another. Each ends with a verdict:
#     ## passed or failed, or another name a session or a shell action's
#     ## verdicts gives.
#     actions:
#       ## The name of one of actions.
#       - tests
#       ## A session, in its own coding-agent session.
#       - ## The agent that runs the session: one of agents. It can be left
#         ## out when agents declares exactly one.
#         agent: developer
#         ## The session's name in the rule: its agent's name by default.
#         name: implement
#         ## How long the session waits for an answer to a question it asks
#         ## on the issue, a Go duration such as 10m or 1h30m, before it ends
#         ## as waiting.
#         wait: 10m
#         ## The session's prompt, a Go template over the item the rule took:
#         ## {{.Issue.Ref}}, {{.Issue.Key}}, {{.Issue.Title}}, {{.Issue.URL}}.
#         prompt: |-
#           Implement {{.Issue.Ref}}, "{{.Issue.Title}}" ({{.Issue.URL}}).
#           Open a pull request whose body has the line `Closes {{.Issue.Ref}}`.
#         ## Where each verdict leads: next, the next action, or one of the
#         ## rule's routes, which ends the run there. Without an entry, passed
#         ## leads to next and every other verdict to failed.
#         on:
#           blocked: blocked
#       ## One of actions, with its on and name beside it, and its own key
#       ## left empty.
#       - judge:
#         name: judge
#         on:
#           needs_person: needs-person
#       - pr-opened
#     ## The rule's routes by name, each a way to end a run. A rule with
#     ## actions declares passed and failed, and every route an on leads to.
#     ## A route is a label to move the item to, or a list of steps, run in
#     ## order, whose last step, and only it, is move or close. No route moves
#     ## the item to the rule's own ready label or to any rule's running label.
#     routes:
#       passed: in review
#       failed:
#         ## report posts crew's report: the action that ended the run, and
#         ## its log.
#         - report
#         - move: failed
#       blocked:
#         ## comment posts a comment, a Go template over .Issue, .Rule,
#         ## .Action, .Verdict, .Route and .Log, never what a session or a
#         ## script printed.
#         - comment: "{{.Action}} stopped as {{.Verdict}}. Its log is {{.Log}}."
#         ## close closes the issue.
#         - close
#       needs-person:
#         ## One of actions, by name, or with its own key left empty.
#         - tests
#         - pr-opened:
#         - move: needs person
#   review:
#     takes: pull_requests
#     queue: reviews
#     labels:
#       ready: review
#       running: reviewing
#     actions:
#       - agent: reviewer
#         prompt: |-
#           Review the pull request {{.Issue.Ref}} and comment on what to change.
#     routes:
#       passed: reviewed
#       failed:
#         - report
#         - move: review failed
#   ## A rule without actions: crew moves the label itself, without a session,
#   ## so it spends no tokens and never fails. It declares only passed.
#   approve:
#     labels:
#       ready: approved
#       running: approving
#     routes:
#       passed: ready
