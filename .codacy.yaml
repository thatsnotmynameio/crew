---
# Codacy's analysis scope and engine options. Codacy reads this file from the
# default branch only. Tools, patterns and their thresholds live in
# .codacy/codacy.config.json; the quality gates are set in the Codacy UI
# (docs/develop/quality.mdx). After editing this file, run
# `pnpm exec codacy-analysis update-config` and commit both files together.
#
# Exclude only material that is not crew's source. Never exclude first-party
# code to hide a finding: fix it, or suppress that one finding with a reason.
exclude_paths:
  # Installed packages for the docs and the Codacy CLIs.
  - "node_modules/**"
engines:
  duplication:
    # Codacy owns duplication (golangci-lint's dupl is off). 100 tokens is the
    # threshold strict Go setups agree on; below it, Go's repeated error
    # handling reads as clones.
    minTokenMatch: 100
    exclude_paths:
      # Recorded Claude sessions and TUI golden files repeat by nature. They
      # stay in secret scanning.
      - "internal/adapter/claude/testdata/**"
      - "internal/ui/tui/testdata/**"
      # Table-driven tests repeat their case shape on purpose.
      - "**/*_test.go"
