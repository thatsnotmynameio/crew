    reason: "development dependency of the Codacy CLIs (@codacy/analysis-cli > @codacy/analysis-adapters > @codacy/tools-eslint-8 > eslint-plugin-formatjs > @typescript-eslint/utils > @typescript-eslint/typescript-estree > minimatch); #385 removes pnpm-lock.yaml"
