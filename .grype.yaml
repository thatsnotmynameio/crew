# Grype's configuration for the grype job in .github/workflows/security.yml.
# It holds only ignore rules. Each names a vulnerability id and a package,
# with the reason the finding stays open. Never ignore by fix state, by
# location, through exclude or only-fixed: each would also drop the matches
# on malware advisories, which have no fixed version. A malware match is
# never ignored: the package is removed instead. No fail-on-severity either:
# grype would then exit non-zero on findings, which the job reads as an error.
ignore:
  # The Codacy CLIs' development dependencies, in pnpm-lock.yaml. crew's
  # binary contains none of them. #385 removes pnpm-lock.yaml, and these
  # rules with it.
  - vulnerability: GHSA-pfrx-2q88-qq97
    package:
      name: got
    reason: "development dependency of the Codacy CLIs (@codacy/analysis-cli > update-notifier > latest-version > package-json > got); #385 removes pnpm-lock.yaml"
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    package:
      name: braces
    reason: "development dependency of the Codacy CLIs (@codacy/analysis-cli > @codacy/analysis-adapters > @codacy/tools-eslint-9 > @dword-design/eslint-plugin-import-alias > micromatch > braces); #385 removes pnpm-lock.yaml"
