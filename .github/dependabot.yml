# Weekly pull requests for new versions: the actions and thatsnotmynameio/.github's
# shared workflows (pinned by SHA), the Codacy CLIs, the Go modules: crew's
# and the acceptance suite's (acceptance/), and the TypeSafe judge's Python
# project (typesafe/, its uv.lock). Dependabot's "npm" ecosystem is the one for
# pnpm too: it reads pnpm-lock.yaml and updates it with pnpm.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/acceptance"
    schedule:
      interval: "weekly"
  # A release waits a week before Dependabot proposes it, so a broken or
  # compromised one is likely pulled first. Security updates skip the wait.
  - package-ecosystem: "uv"
    directory: "/typesafe"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
