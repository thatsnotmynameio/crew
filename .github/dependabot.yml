# Weekly pull requests for new versions: the actions and thatsnotmynameio/.github's
# shared workflows (pinned by SHA), the Codacy CLIs, and the Go modules: crew's
# and the acceptance suite's (acceptance/). Dependabot's "npm" ecosystem is the
# one for pnpm too: it reads pnpm-lock.yaml and updates it with pnpm.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # modernc.org/libc moves only with modernc.org/sqlite: the driver needs
    # exactly the libc its go.mod names, which a driver bump raises.
    ignore:
      - dependency-name: "modernc.org/libc"
  - package-ecosystem: "gomod"
    directory: "/acceptance"
    schedule:
      interval: "weekly"
