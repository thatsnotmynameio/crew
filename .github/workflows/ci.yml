# Every pull request: the release rule on VERSION, actionlint over the
# workflows, the Go module, and the acceptance suite against the release
# build. Pushes to main run the Go module too, so Codacy gets each main
# commit's results and coverage baseline, and the suite. Add the project's
# build and test jobs here, and their check names to the "checks" ruleset
# (bootstrap.sh --checks, in thatsnotmynameio/.github).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer run replaces the older one. Each main commit gets a
# group of its own and is never cancelled: Codacy waits for every commit's
# results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release rule reads the v* tags
          persist-credentials: false
      - uses: thatsnotmynameio/.github/actions/release@684e95730da54880499f6b8401fe00d9b10aa8c4 # v0.1.0
        with:
          mode: check

  actionlint:
    uses: thatsnotmynameio/.github/.github/workflows/actionlint.yml@684e95730da54880499f6b8401fe00d9b10aa8c4 # v0.1.0

  # The Go module: formatting, vet, lint (including the layering rules in
  # .golangci.yml), tests with the race detector and coverage, the coverage
  # floors, and known vulnerabilities. It holds no secret: on a Dependabot
  # pull request the updated module runs here.
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The pull request's head commit, not its merge into main: Codacy reports
      # coverage on the head commit, so line numbers must match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # diffcover compares with the base branch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal tools acceptance)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: go test
        if: ${{ !cancelled() }}
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: coverage floor
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.19.0 --config=.testcoverage.yml
      - name: changed lines coverage
        if: github.event_name == 'pull_request'
        # bash runs with pipefail, so a failing git diff fails the step
        # instead of handing diffcover an empty diff.
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff -U0 "origin/$BASE_REF...HEAD" | go run ./tools/diffcover -profile coverage.out
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # The codacy job uploads it. Kept even when a check above failed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: codacy-coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 3

  # The acceptance suite (acceptance/, its own Go module): its vet, lint and
  # known vulnerabilities, then its tests against crew's binary. GoReleaser
  # builds that binary from .goreleaser.yaml as a Linux amd64 snapshot, so the
  # suite tests what a release ships, with the release's build flags and
  # stamped version, not a plain go build. No paths filter: this job belongs
  # in the checks ruleset, and a required check that is skipped stays pending.
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the snapshot's version is the latest v* tag
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: build --snapshot --single-target --clean --output ${{ runner.temp }}/crew
        env:
          GOOS: linux
          GOARCH: amd64
      - name: go vet
        run: go -C acceptance vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: acceptance
      - name: govulncheck
        working-directory: acceptance
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # Runs after a vet, lint or govulncheck failure too, but not without the
      # binary. go test -outputdir needs the directory to exist.
      - name: go test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: acceptance
        env:
          CREW_BIN: ${{ runner.temp }}/crew
          ARTIFACTS: ${{ runner.temp }}/acceptance-artifacts
        run: |
          mkdir -p "$ARTIFACTS"
          go test -race -count=1 -timeout 10m -artifacts -outputdir "$ARTIFACTS" ./...
      # What the tests saved in t.ArtifactDir(), to see why they failed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: acceptance-artifacts
          path: ${{ runner.temp }}/acceptance-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # Sends the go job's coverage to Codacy. Codacy analyses the code itself, on
  # its servers; golangci-lint's findings stay in the go job. This is the only
  # job that sees the token, and it runs no code from the repository: it reads
  # the profile and runs Codacy's pinned, checksummed reporter. Off until the
  # repository variable CODACY_ENABLED is true.
  codacy:
    name: codacy
    needs: go
    # Dependabot's pull requests get no Actions secrets, and Codacy does not
    # analyse them (it analyses only commits by its organization's members).
    if: ${{ !cancelled() && vars.CODACY_ENABLED == 'true' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      REPORTER_VERSION: 14.1.3
      REPORTER_SHA512: 73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17
    steps:
      - name: token
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::error::CODACY_PROJECT_TOKEN is empty or missing. It may have expired: create a new project API token in Codacy and save it as this secret." >&2
            exit 1
          fi
      # The reporter resolves the profile's paths against the checkout.
      # Nothing from the checkout runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codacy-coverage
          path: ${{ runner.temp }}/results
      - name: Codacy's coverage reporter
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o codacy-coverage-reporter "https://github.com/codacy/codacy-coverage-reporter/releases/download/$REPORTER_VERSION/codacy-coverage-reporter-linux"
          echo "$REPORTER_SHA512  codacy-coverage-reporter" | sha512sum --check --strict
          chmod +x codacy-coverage-reporter
      - name: coverage
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          profile="$RUNNER_TEMP/results/coverage.out"
          if [ -f "$profile" ]; then
            "$RUNNER_TEMP/codacy-coverage-reporter" report --project-token "$CODACY_PROJECT_TOKEN" \
              --commit-uuid "$COMMIT" --force-coverage-parser go -r "$profile"
          else
            echo "No coverage profile: the tests did not run." >&2
          fi

  # Waits for Codacy's own check on the pull request's head commit and repeats
  # its verdict, so the "checks" ruleset can require Codacy through a GitHub
  # Actions job. A required job that is skipped counts as passing, which lets
  # Dependabot's pull requests through: Codacy never analyses them. Off until
  # the repository variable CODACY_ENABLED is true.
  codacy-gate:
    name: codacy gate
    if: ${{ github.event_name == 'pull_request' && vars.CODACY_ENABLED == 'true' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Codacy Static Code Analysis
        shell: bash
        run: |
          url="repos/$REPO/commits/$SHA/check-runs?check_name=Codacy%20Static%20Code%20Analysis"
          for _ in $(seq 1 72); do
            run=$(gh api "$url" --jq '.check_runs | sort_by(.started_at) | last // empty | "\(.status) \(.conclusion) \(.details_url)"')
            read -r status conclusion details <<< "$run"
            if [ "$status" = "completed" ]; then
              echo "Codacy: $conclusion ($details)"
              case "$conclusion" in
                success|neutral) exit 0 ;;
                *) echo "::error::Codacy Static Code Analysis is $conclusion: $details" >&2; exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "::error::Codacy reported no verdict on $SHA within 18 minutes." >&2
          exit 1
