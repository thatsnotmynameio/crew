# Every pull request: the release rule on VERSION, actionlint over the
# workflows, and the Go module. Pushes to main run the Go module too, so
# Codacy gets each main commit's results and coverage baseline. Add the
# project's build and test jobs here, and their check names to the "checks"
# ruleset (bootstrap.sh --checks, in thatsnotmynameio/.github).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer run replaces the older one. Each main commit gets a
# group of its own and is never cancelled: Codacy waits for every commit's
# results (docs/develop/quality.mdx).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release rule reads the v* tags
          persist-credentials: false
      - uses: thatsnotmynameio/.github/actions/release@684e95730da54880499f6b8401fe00d9b10aa8c4 # v0.1.0
        with:
          mode: check

  actionlint:
    uses: thatsnotmynameio/.github/.github/workflows/actionlint.yml@684e95730da54880499f6b8401fe00d9b10aa8c4 # v0.1.0

  # The Go module: formatting, vet, lint (including the layering rules in
  # .golangci.yml), tests with the race detector and coverage, the coverage
  # floors, and known vulnerabilities. It holds no secret: on a Dependabot
  # pull request the updated module runs here.
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The pull request's head commit, not its merge into main: Codacy reports
      # on the head commit, so line numbers must match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # diffcover compares with the base branch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal tools)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --output.text.path=stdout --output.json.path=golangci-lint.json
      - name: go test
        if: ${{ !cancelled() }}
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: coverage floor
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.19.0 --config=.testcoverage.yml
      - name: changed lines coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff -U0 "origin/$BASE_REF...HEAD" | go run ./tools/diffcover -profile coverage.out
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # The codacy job uploads these. Kept even when a check above failed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: codacy-results
          path: |
            golangci-lint.json
            coverage.out
          if-no-files-found: ignore
          retention-days: 3

  # Sends the go job's lint results and coverage to Codacy. It is the only job
  # that sees the token, and it runs no code from the repository: it reads the
  # files and runs Codacy's pinned, checksummed binaries. Off until the
  # repository variable CODACY_ENABLED is true (docs/develop/quality.mdx).
  codacy:
    name: codacy
    needs: go
    if: ${{ !cancelled() && vars.CODACY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CONVERTER_VERSION: 0.0.9
      CONVERTER_SHA256: 415081dfae5e8f7f6096f0e46a8ce87b2e45382d6eadba66fc774c7002366cb0
      REPORTER_VERSION: 14.1.3
      REPORTER_SHA512: 73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17
    steps:
      - name: token
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::error::CODACY_PROJECT_TOKEN is empty or missing. It may have expired: see 'Rotating the Codacy token' in docs/develop/quality.mdx." >&2
            exit 1
          fi
      # The converter resolves the lint results' paths against the checkout.
      # Nothing from the checkout runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codacy-results
          path: ${{ runner.temp }}/results
      - name: Codacy's binaries
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o codacy-golangci-lint "https://github.com/codacy/codacy-golangci-lint/releases/download/$CONVERTER_VERSION/codacy-golangci-lint-$CONVERTER_VERSION"
          echo "$CONVERTER_SHA256  codacy-golangci-lint" | sha256sum --check --strict
          curl -fsSL -o codacy-coverage-reporter "https://github.com/codacy/codacy-coverage-reporter/releases/download/$REPORTER_VERSION/codacy-coverage-reporter-linux"
          echo "$REPORTER_SHA512  codacy-coverage-reporter" | sha512sum --check --strict
          chmod +x codacy-golangci-lint codacy-coverage-reporter
      - name: lint results
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          results="$RUNNER_TEMP/results/golangci-lint.json"
          if [ -f "$results" ]; then
            "$RUNNER_TEMP/codacy-golangci-lint" < "$results" > "$RUNNER_TEMP/codacy-issues.json"
          else
            echo '[]' > "$RUNNER_TEMP/codacy-issues.json"
          fi
          curl -fsS -X POST -H "project-token: $CODACY_PROJECT_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/codacy-issues.json" \
            "https://api.codacy.com/2.0/commit/$COMMIT/issuesRemoteResults"
      - name: coverage
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          profile="$RUNNER_TEMP/results/coverage.out"
          if [ -f "$profile" ]; then
            "$RUNNER_TEMP/codacy-coverage-reporter" report --project-token "$CODACY_PROJECT_TOKEN" \
              --commit-uuid "$COMMIT" --force-coverage-parser go -r "$profile"
          else
            echo "No coverage profile: the tests did not run." >&2
          fi
      # Codacy waits for this call before it analyses the commit, so it runs
      # even when a step above failed.
      - name: results final
        if: ${{ !cancelled() }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          curl -fsS -X POST -H "project-token: $CODACY_PROJECT_TOKEN" -H "Content-Type: application/json" \
            "https://api.codacy.com/2.0/commit/$COMMIT/resultsFinal"
