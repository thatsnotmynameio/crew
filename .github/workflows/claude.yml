# @claude in an issue, a pull request or a review: Claude answers or works on
# what it asks. CLAUDE_CODE_OAUTH_TOKEN is an organization secret.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    uses: thatsnotmynameio/.github/.github/workflows/claude.yml@684e95730da54880499f6b8401fe00d9b10aa8c4 # v0.1.0
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
