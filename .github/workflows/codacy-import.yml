# Applies .codacy/codacy.config.json (which Codacy tools run, with which
# patterns and thresholds) to Codacy whenever it changes on main, so the file
# in the repository is what Codacy enforces. Run it by hand once after the
# Codacy setup in docs/develop/quality.mdx. Off until the repository variable
# CODACY_ENABLED is true.
name: Codacy import

on:
  push:
    branches: [main]
    paths:
      - .codacy/codacy.config.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  import:
    name: import
    if: vars.CODACY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Through pnpm so that codacy-analysis is on the PATH: the import asks it
      # which tools exist, to disable the ones the file leaves out. The CLI
      # exits 0 even when some tools fail to apply (for example a tool a
      # coding standard forces on), so its report decides the step's result.
      - name: import
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          pnpm exec codacy tools gh ${{ github.repository_owner }} ${{ github.event.repository.name }} --import --skip-approval 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -q "error(s)" "$RUNNER_TEMP/import.log"; then
            echo "::error::The Codacy import did not apply every tool; see the errors above and docs/develop/quality.mdx." >&2
            exit 1
          fi
