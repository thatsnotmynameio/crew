# Started by hand on main: releases the commit it was started on as the
# version VERSION names there, tag vX.Y.Z and a GitHub release. Merging a
# pull request, a version bump included, publishes nothing. The run fails
# without publishing, saying why, when it was started on another branch, when
# the version already has a tag or a published release, or when
# CHANGELOG.md has no section for it (tools/release check). GoReleaser
# (.goreleaser.yaml) builds crew for macOS and Linux and publishes the
# archives and checksums.txt with that section as the release text. Nothing
# is published unless every asset built: the tag stays local until GoReleaser
# publishes the release, and a new run finishes a release a failed upload
# left as a draft. Unlike CI, this does not use the shared release action's
# publish mode, only its check.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a run never cancels another
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release rule reads the v* tags
          persist-credentials: false
      # VERSION is MAJOR.MINOR.PATCH and not below the latest release.
      - uses: thatsnotmynameio/.github/actions/release@684e95730da54880499f6b8401fe00d9b10aa8c4 # v0.1.0
        with:
          mode: check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The notes go outside the checkout: GoReleaser refuses a dirty tree.
      - name: Check the release
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools/release check -ref "$GITHUB_REF" -notes "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
      # Local only: GitHub creates the tag when the release is published.
      - name: Tag the release locally
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: git tag "$TAG"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
