# docs.page's check of docs.json and docs/**/*.mdx on every pull request.
# Its check is "docs / docs.page check".
name: Docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: thatsnotmynameio/.github/.github/workflows/docs.yml@684e95730da54880499f6b8401fe00d9b10aa8c4 # v0.1.0
