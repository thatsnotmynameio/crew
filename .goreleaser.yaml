# What a release builds and uploads to a draft release: crew for macOS and
# Linux on amd64 and arm64, one tar.gz per platform, and checksums.txt. The
# Release workflow (.github/workflows/release.yml) runs it, attests the
# assets, publishes the draft and says when a release happens.
# Try it locally with a snapshot build:
# go run github.com/goreleaser/goreleaser/v2@v2.18.2 release --snapshot --clean
version: 2

project_name: crew

builds:
  - main: ./cmd/crew
    binary: crew
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin] # no Windows: internal/proc needs Unix process groups
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # The v-prefixed tag, so crew --version prints crew vX.Y.Z.
    ldflags: ["-s -w -X main.version={{ .Tag }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

# No version in the names: releases/latest/download/<name> is then a stable
# URL for the install command in the README.
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  name_template: "{{ .Tag }}"
  # A draft: the Release workflow publishes it once the archives and their
  # binaries are attested and verified.
  draft: true
  # The tag stays local until the draft is published, then GitHub creates it
  # at the built commit.
  target_commitish: "{{ .Commit }}"
  # A re-run finishes the draft a failed run left, with this run's notes and
  # assets.
  use_existing_draft: true
  replace_existing_artifacts: true
  mode: replace
