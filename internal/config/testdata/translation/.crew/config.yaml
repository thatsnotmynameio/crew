# yaml-language-server: $schema=https://raw.githubusercontent.com/thatsnotmynameio/crew/main/schema/config.schema.json
# A translation team's config, invented for the tests: a full config with
# queues, bots, agents on both harnesses, shell actions defined as a string
# and as a mapping, rules with and without actions, sessions with and
# without a name or a wait, on maps, routes as a label and as a list of
# steps, notify set both ways, multi-line prompts and an answering list.
poll_interval_seconds: 120
max_parallel_issues: 4
answering_apps:
  - glossary-keeper[bot]
  - linguist[bot]
queues:
  desk: 1
  translators: 2
tracker:
  name: github
  bot: concierge
agents:
  translator:
    harness:
      name: claude
      model: claude-sonnet-5-5
    bot: linguist
  proofreader:
    harness:
      name: codex
      model: gpt-5.5
actions:
  glossary-kept: grep -rq glossary docs/
  draft-pushed:
    script: |-
      n=$(git rev-list --count "origin/$CREW_BRANCH" 2>/dev/null) || n=0
      [ "$n" -gt 0 ] || { echo "nothing pushed to $CREW_BRANCH"; exit 3; }
    verdicts:
      3: unpushed
    resume: self
rules:
  accept request:
    queue: desk
    labels:
      ready: "request:new"
      running: "request:accepting"
    routes:
      passed: "translation:to do"
  translation:
    queue: translators
    labels:
      ready: "translation:to do"
      running: "translation:drafting"
    actions:
      - agent: translator
        name: draft
        wait: 30m
        prompt: |-
          Translate the page {{.Issue.Ref}} names, "{{.Issue.Title}}", into Portuguese.

          Keep every term the glossary lists, and push the draft to a branch.
      - glossary-kept
      - draft-pushed:
        on:
          unpushed: unpushed
    routes:
      passed: "translation:drafted"
      failed:
        - report
        - move: "translation:stuck"
      unpushed:
        - comment: "{{.Issue.Ref}}: `{{.Action}}` found no draft pushed. Its log is {{.Log}}."
        - move: "translation:stuck"
  proofreading:
    notify: false
    labels:
      ready: "translation:drafted"
      running: "translation:proofreading"
    actions:
      - agent: proofreader
        name: proofread
        prompt: Proofread the draft of {{.Issue.Ref}} ({{.Issue.URL}}).
        on:
          failed: rejected
          waiting: next
      - glossary-kept
      - agent: translator
        prompt: Typeset the draft of {{.Issue.Ref}} for print.
    routes:
      passed: "translation:published"
      failed:
        - report
        - move: "translation:rejected"
      rejected:
        - comment: "{{.Issue.Ref}} was rejected in {{.Rule}}."
        - glossary-kept
        - close
  archive:
    notify: true
    labels:
      ready: "translation:published"
      running: "translation:archiving"
    routes:
      passed: "translation:archived"
