# The code owner's draft config, with #XXX written as a template, in the
# rules' format of a sequence of actions and routes. It is the schema's
# reference.
poll_interval_seconds: 300
max_parallel_issues: 2
tracker:
  name: github
agents:
  claude:
    harness:
      name: claude
      model: claude-opus-5-5
rules:
  implement:
    labels:
      ready: ready
      running: in progress
    actions:
      - name: acceptance
        prompt: "Implement test acceptance for issue {{.Issue.Ref}}"
      - name: development
        prompt: "Implement development for issue {{.Issue.Ref}}"
    routes:
      passed: ready to review
      failed:
        - report
        - move: needs attention
  review:
    labels:
      ready: ready to review
      running: in review
    actions:
      - name: custom_review
        prompt: "Review implementation for issue {{.Issue.Ref}}"
    routes:
      passed: ready to merge
      failed:
        - report
        - move: needs attention
