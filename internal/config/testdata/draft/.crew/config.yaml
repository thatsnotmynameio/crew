# The boss's draft config, with #XXX written as a template and on_success added
# (KTD5). It is the schema's reference.
config:
  poll_interval_seconds: 300
  max_parallel_issues: 2
  harness: claude
  model: claude-opus-5-5
tracker:
  name: github
  labels:
    ready: ready
    in_progress: in progress
    ready_to_review: ready to review
    in_review: in review
    needs_attention: needs attention
    paused: paused
    ready_to_merge: ready to merge
    done: done
workflow:
  - name: implement
    label: ready
    moves_to: in_progress
    on_success: ready_to_review
    actions:
      - name: acceptance
        prompt: "Implement test acceptance for issue {{.Issue.Ref}}"
      - name: development
        prompt: "Implement development for issue {{.Issue.Ref}}"
  - name: review
    label: ready_to_review
    moves_to: in_review
    on_success: ready_to_merge
    actions:
      - name: custom_review
        prompt: "Review implementation for issue {{.Issue.Ref}}"
