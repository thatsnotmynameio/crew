# The code owner's draft config, with #XXX written as a template and
# labels.success added (KTD5). It is the schema's reference.
poll_interval_seconds: 300
max_parallel_issues: 2
tracker:
  name: github
agents:
  claude:
    harness:
      name: claude
      model: claude-opus-5-5
rules:
  implement:
    labels:
      ready: ready
      running: in progress
      success: ready to review
      failure: needs attention
    actions:
      acceptance:
        prompt: "Implement test acceptance for issue {{.Issue.Ref}}"
      development:
        prompt: "Implement development for issue {{.Issue.Ref}}"
  review:
    labels:
      ready: ready to review
      running: in review
      success: ready to merge
      failure: needs attention
    actions:
      custom_review:
        prompt: "Review implementation for issue {{.Issue.Ref}}"
